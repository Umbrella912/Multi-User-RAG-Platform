# Nginx reverse proxy for the Multi-User RAG Platform.
#
# Routes:
#   /        -> Streamlit frontend   (frontend:8501)
#   /api     -> FastAPI backend      (backend:8000)
#   /health  -> FastAPI backend      (backend:8000)
#
# HTTPS is enabled with Let's Encrypt certificates at
# /etc/letsencrypt/live/<domain>/. The HTTP server redirects all traffic to
# HTTPS. SSE (Server-Sent Events) for chat streaming is supported via
# proxy_buffering off and a long read timeout.
#
# Install to: /etc/nginx/sites-available/rag && symlink into sites-enabled,
# then `nginx -t && systemctl reload nginx`.

# --- Upstreams ---------------------------------------------------------------
# Nginx runs on the EC2 host (not in the Docker network), so it reaches the
# services through their published host ports (docker compose maps 8000/8501).
upstream rag_frontend {
    server 127.0.0.1:8501;
}

upstream rag_backend {
    server 127.0.0.1:8000;
}

# --- HTTP -> HTTPS redirect --------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge (if using certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rag.example.com;  # <- replace with your domain

    ssl_certificate     /etc/letsencrypt/live/rag.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.example.com/privkey.pem;

    # Modern TLS configuration (Mozilla intermediate).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling.
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Backend API (FastAPI) ---
    location /api/ {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / long-lived streaming: disable buffering, extend timeouts.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # --- Health checks ---
    location /health {
        proxy_pass http://rag_backend;
        proxy_set_header Host $host;
    }

    # --- Streamlit frontend (catch-all) ---
    location / {
        proxy_pass http://rag_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit websocket support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Larger client body for document uploads (25 MB default + margin).
    client_max_body_size 50m;
}
