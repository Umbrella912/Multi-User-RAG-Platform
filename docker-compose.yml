# Development orchestration for the Multi-User RAG Platform.
# Services: postgres + chromadb + backend + streamlit frontend.
#
# For production overrides (restart policies, resource limits, prod env),
# see docker-compose.prod.yml.
#
# Before running: copy backend/.env.example to backend/.env and fill in real
# values (especially JWT_SECRET and provider API keys).

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.5
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v2/heartbeat', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    # Image name is overridable so production can pull from ECR
    # (IMAGE_BACKEND=<ecr-repo>:<tag>) without rebuilding.
    image: ${IMAGE_BACKEND:-multi-rag-backend:latest}
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    environment:
      # Override the DB host to the postgres service inside the network.
      DATABASE_URL: postgresql+asyncpg://rag_user:rag_password@postgres:5432/rag_platform
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    command:
      - "sh"
      - "-c"
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    # Image name is overridable so production can pull from ECR
    # (IMAGE_FRONTEND=<ecr-repo>:<tag>) without rebuilding.
    image: ${IMAGE_FRONTEND:-multi-rag-frontend:latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  chromadata:
